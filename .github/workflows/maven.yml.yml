# GitHub Actions 工作流配置文件
# 文件名: .github/workflows/maven.yml
# 功能: 持续集成(CI) - 每次推送代码或创建拉取请求时自动构建和测试 Java 项目

name: Java CI with Maven

# 触发条件配置
on:
  # 推送到默认分支(如 main/master)时触发
  push:
    branches: [ main, master ]
  # 创建针对默认分支的拉取请求时触发
  pull_request:
    branches: [ main, master ]
  # 可选: 手动触发工作流运行
  # workflow_dispatch:

# 定义工作流的 Jobs
jobs:
  # Job 1: 构建、测试和代码质量检查
  build:
    # 运行环境: 最新 Ubuntu Linux
    runs-on: ubuntu-latest

    # 定义该 Job 的各个步骤
    steps:
      # Step 1: 检出代码到运行器
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: 设置 JDK 21 运行环境
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'  # 使用 Eclipse Temurin (OpenJDK 的高质量发行版)
          architecture: x64

      # Step 3: 缓存 Maven 依赖项 (加速构建)
      # 缓存键基于 pom.xml 的哈希值，当依赖变化时自动失效
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 4: 使用 Maven 执行构建和测试
      - name: Build and test with Maven
        run: mvn --batch-mode --update-snapshots verify

      # Step 5: 将构建产物(JAR文件)上传为构件(Artifact)
      # 这样可以在 GitHub Actions 界面下载构建好的 JAR 文件
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()  # 仅在构建成功时上传
        with:
          name: build-artifacts
          path: target/*.jar

  # Job 2: 代码风格检查(可选，展示更完善的 CI 流程)
  checkstyle:
    runs-on: ubuntu-latest
    needs: build  # 依赖 build job 成功完成

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run checks with Maven
        run: mvn --batch-mode checkstyle:check