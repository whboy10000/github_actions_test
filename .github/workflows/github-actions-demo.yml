# 工作流名称
name: Go CI Pipeline

# 触发条件：当推送到 main 分支，或向 main 分支发起 Pull Request 时触发
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # 运行在最新的 Ubuntu 环境中
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码 (已加上 name，保持格式统一)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Go 环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # 3. 下载依赖
      # 💡 优化点：使用 go mod download 替代 go get .，在 CI 中更规范且支持缓存
      - name: Download dependencies
        run: go mod download

      # 4. 运行测试
      # -v 参数表示 verbose，会在日志中打印出每个测试用例的运行细节
      - name: Run tests
        run: go test -v ./...